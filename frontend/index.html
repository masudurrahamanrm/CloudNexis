    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Initial Load Skeleton / Preloader to prevent black screen delay -->
      <style>
        body { background-color: #030712; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .preloader { display: flex; flex-direction: column; align-items: center; gap: 20px; font-family: 'Inter', sans-serif; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(59, 130, 246, 0.2); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glow { position: absolute; width: 150px; height: 150px; background: rgba(59, 130, 246, 0.2); border-radius: 50%; filter: blur(40px); animation: pulse 2s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.5); opacity: 0.5; } }
      </style>
      <div class="glow"></div>
      <div class="preloader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isLocalhost = Boolean(
        window.location.hostname === 'localhost' ||
        window.location.hostname === '[::1]' ||
        window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
      );

      if ('serviceWorker' in navigator) {
        if (isLocalhost) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => {
              for (const key of keys) caches.delete(key);
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(registration => console.log('SW registered'))
              .catch(err => console.log('SW registration failed'));
          });
        }
      }
    </script>
  </body>
</html>
